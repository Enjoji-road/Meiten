  function filmFrame(rec,t){
    const r=rec.room,hand=rec.hand;let world=Meiten.clone(rec.pre);

    const anchor=r===5?[568,408]:[552,402],target=hand?points[r]?.[hand.key]||anchor:anchor;

    let pos=anchor,seated=r===5,reach=false;
    if(hand){
      if(t<2.4){pos=target;seated=false;reach=t>=.5;}
      else if(t<4.4){pos=lerp(target,anchor,(t-2.4)/2);seated=false;}

      else if(t<7.0){pos=anchor;seated=false;}

    // A simultaneous magnification, never a replacement or cut of the main recording.

    overlay+=line(wrist[0],wrist[1],530,203,'#758775',1.1,'stroke-dasharray="4 4"')+rect(wrist[0]-7,wrist[1]-7,14,14,'none','#9baa80',2)+rect(412,57,213,146,'#c9cebc','#617c69',6)+text(422,77,'DETAIL',12,'#3c5643')+`<g transform="translate(417 80) scale(1.02)">${handArt()}</g>`;

  function dispatch(action){

    if(action==='work'){notice='';if(Meiten.enterWork(state)){state.caption=null;render();}return;}

      const k=action.split(':')[1],v=state.rooms[state.room][k];
      if(Meiten.change(state,k,!v)){notice='';if(state.room===2&&k==='curtain'&&!v)say('a-station','あの駅からなら、いつもの道だ。');render();$('hands')?.classList.add('show');}return;
    }

    if(action==='return'||action==='recordStart'){stepBack(action==='recordStart'?'recording':'view');return;}
    if(action==='face'){if(state.view==='overview')Meiten.enterWork(state);stepBack();return;}
    if(action==='transport'){runTransport();return;}
    if(action.startsWith('go:')){const res=Meiten.navigate(state,Number(action.split(':')[1]));if(res.needsReturn){stepBack();return;}notice=res.ok?'':res.reason;render();return;}
    if(action==='paper'){showPaper();return;}
    if(action==='call'){notice='呼出し：応答なし';state.caption=null;render();return;}
    if(action==='terminal'){openModal('read',modalHead('閲覧端末')+'<p>閲覧：停止中<br>記録：継続中</p>'+recordingGoal(state.rooms[5]));return;}
    if(action==='archive'){openArchive();return;}
    if(action==='archive01'){if(state.flags.archiveReady)openArchive(archive01());return;}
    if(action==='trial'){if(state.flags.trialSeen)showTrial();return;}
    if(action==='close'){
      const paper=modalKind==='paper';if(modalKind==='archive'){state.film=null;save();}closeModal();
      if(paper)stepBack();else render();return;
    }
    if(action==='settings'){showSettings();return;}
    if(action==='resetAsk'){askReset();return;}
    if(action==='reset'){reset();return;}
    if(action==='filmNext'){nextFilm();return;}
    if(action==='replay'){if(state.film){state.film.elapsed=0;save();playFilm();}return;}

    if(action==='walk'&&state.ending?.stage===7){state.ending.stage=8;state.ending.until=0;save();driveEnding();return;}
  }

  document.addEventListener('change',e=>{if(['still','speech'].includes(e.target.id)){prefs[e.target.id]=e.target.checked;try{localStorage.setItem(PREF,JSON.stringify(prefs));}catch{}}});
  window.addEventListener?.('pagehide',()=>{if(state.started)save();});
  document.addEventListener('visibilitychange',()=>{if(state.started)save();});
  $('menu').addEventListener('click',()=>{if(!busy&&!modalKind)showSettings();});
  $('begin').addEventListener('click',()=>{if(saved?.started){askReset();return;}state=Meiten.start(Meiten.fresh());discardedSave=false;$('versionNotice').hidden=true;notice='';say('a-wait','もう、ずいぶん待った。');render();});
  $('resume').addEventListener('click',()=>{if(!saved)return;state=saved;notice='';render();resumeActivities();});
  $('endArchive').addEventListener('click',()=>{if(!busy)openArchive();});$('endBoxArchive').addEventListener('click',()=>{if(!busy&&state.flags.archiveReady)openArchive(archive01());});$('restartEnd').addEventListener('click',askReset);
  render();
})();

</script></body></html>
