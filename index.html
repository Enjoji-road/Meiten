<script>'use strict';

  const VERSION=7;

  function enterWork(s){if(s.ended||s.activity)return false;s.view='work';return true;}
  function change(s,key,value){
    if(s.ended||s.activity||s.view!=='work'||!keys[s.room].includes(key)||!validValue(key,value))return false;
    const from=s.rooms[s.room][key];if(from===value)return false;s.rooms[s.room][key]=value;s.pending={room:s.room,key,from,to:value};return true;
  }
  function readSign(s){if(s.room!==1||s.view!=='work'||!s.rooms[1].box||s.activity)return false;s.flags.signRead=true;return true;}
  function observeBox(s){const h=s.history.at(-1);if(s.room===1&&s.view==='afterBox'&&h?.boxEncounter&&!s.rooms[1].box)s.flags.boxSeen=true;}
  function leaveBox(s){if(s.room!==1||s.view!=='afterBox'||s.activity)return false;s.view='overview';return true;}
  function navigate(s,r){
    if(s.ended||s.activity)return {ok:false,reason:'まだ移動できない。'};
    if(s.view==='afterBox')return {ok:false,reason:'まず、部屋へ戻る。'};
    if(s.view==='work')return {ok:false,reason:'まず、手元から離れる。',needsReturn:true};
    if(!allowed(s,r))return {ok:false,reason:'まだ通れる道は見つかっていない。'};
    if(r===s.room)return {ok:true};
    if(s.room===6&&s.boarded&&s.rooms[6].guard)return {ok:false,reason:'柵が閉じている。'};
    if(s.room===6&&r!==6)s.boarded=false;s.room=r;s.view='overview';return {ok:true};
  }
  const snapshot=(s,r)=>Object.fromEntries(keys[r].map(k=>[k,s.rooms[r][k]]));
  function liftRun(pre,post){const departed=pre.guard&&pre.lock,arrived=departed&&post.guard;return {departed,arrived,exitOpen:arrived&&!post.lock};}
  function append(s,r,pre,post,hand,success,run,flagsBefore,mode){
    const record={id:++s.serial,room:r,at:new Date().toISOString(),pre,post,hand,success,run,mode,flagsBefore,flagsAfter:clone(s.flags),boxEncounter:r===1&&s.flags.signRead&&!!hand&&!hand.from&&hand.to&&!post.box};s.history.push(record);
    if(s.history.length>500){const first=s.history.filter((h,i,a)=>a.findIndex(x=>x.room===h.room)===i),opening=s.history.find(h=>h.boxEncounter)||s.history.find(h=>h.room===1&&h.hand?.key==='box'&&!h.hand.from&&h.hand.to),monitor=s.history.filter(h=>h.room===5&&h.success).at(-1);const keep=new Map([...first,...(opening?[opening]:[]),...(monitor?[monitor]:[]),...s.history.slice(-450)].map(h=>[h.id,h]));s.history=[...keep.values()].sort((a,b)=>a.id-b.id);}
    return record;
  }
  function returnToView(s,mode='view'){
    if(s.ended||s.activity||s.view!=='work')return null;
    const r=s.room,pre=snapshot(s,r),hand=s.pending?clone(s.pending):null,flagsBefore=clone(s.flags);
    if(hand)s.rooms[r][hand.key]=hand.from;s.pending=null;s.view=r===1?'afterBox':'overview';

  }
  const FILM_LENGTH=17,QUIET_LENGTH=2.6,STILL_TIMES=[0,1.6,4.8,6.8,9.0,11.2,14.4,17];
  function cameraClock(rec,t){const end=Date.parse(rec.at),base=Number.isFinite(end)?end:Date.UTC(2026,0,1,20,41,33);return new Date(base-FILM_LENGTH*1000+Math.floor(t)*1000).toISOString().slice(11,19);}
  function filmFrame(rec,t){
    const r=rec.room,hand=rec.hand;let world=Meiten.clone(rec.pre);
    if(hand&&t<1.6)world[hand.key]=hand.from;
    if(t>=11.2)world=Meiten.clone(rec.post);
    const points={1:{box:[302,272]},5:{left:[199,263],right:[391,263],light:[491,377]}};
    const anchor=r===5?[568,408]:[552,402],target=hand?points[r]?.[hand.key]||anchor:anchor;
    const lerp=(a,b,p)=>[a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p];
    let pos=anchor,seated=r===5,reach=false;
    if(hand){
      if(t<2.4){pos=target;seated=false;reach=t>=.5;}
      else if(t<4.4){pos=lerp(target,anchor,(t-2.4)/2);seated=false;}
      else if(t<6.2){pos=anchor;seated=r===5;}
      else if(t<7.0){pos=anchor;seated=false;}
      else if(t<10){pos=lerp(anchor,target,(t-7)/3);seated=false;}
      else if(t<12){pos=target;seated=false;reach=true;}
      else if(t<14.4){pos=lerp(target,anchor,(t-12)/2.4);seated=false;}
    }
    const walking=(t>=2.4&&t<4.4)||(t>=7&&t<10)||(t>=12&&t<14.4);
    let overlay=(r===5?rect(536,396,64,24,'#536e60','#365242',5)+line(544,420,544,453,'#365242',4)+line(593,420,593,453,'#365242',4):'')+actor(...pos,seated,reach,walking?Math.sin(t*8)*9:0)+rect(0,0,640,45,'#183128')+circle(19,23,4,'#ba6554')+text(32,29,`REC / CAM ${String(r).padStart(2,'0')}`,16,'#d8dfc4')+text(619,31,cameraClock(rec,t),24,'#d8dfc4','end');
    // A simultaneous magnification, never a replacement or cut of the main recording.
    const wrist=[pos[0]+(reach?46:30)*1.25,pos[1]+(seated?10:0)+(reach?-16:-6)*1.25];
    overlay+=line(wrist[0],wrist[1],530,203,'#758775',1.1,'stroke-dasharray="4 4"')+rect(wrist[0]-7,wrist[1]-7,14,14,'none','#9baa80',2)+rect(412,57,213,146,'#c9cebc','#617c69',6)+text(422,77,'DETAIL',12,'#3c5643')+`<g transform="translate(417 80) scale(1.02)">${handArt()}</g>`;
    return sceneSVG(r,world,'work',{camera:true,cameraView:true,overlay,flags:t>=14.4?rec.flagsAfter:rec.flagsBefore});
  }
  function archive01(){return state.history.find(h=>h.room===1&&h.hand?.key==='box'&&h.hand.from===false&&h.hand.to===true)||state.history.find(h=>h.room===1);}
  function playerFrame(rec,t){
    if(t>=5.4&&t<15.2)return '<div class="blind-view" aria-label="視界が黒くなっている"></div>';
    const v=Meiten.clone(t>=15.2?rec.post:rec.pre);if(rec.hand&&t<1.6)v[rec.hand.key]=rec.hand.from;
    const overlay=`<g transform="${rec.room===1?'translate(345 295) scale(.7)':'translate(437 367) scale(1)'}">${handArt()}</g>`;
    return sceneSVG(rec.room,v,'work',{camera:true,overlay,flags:t>=15.2?rec.flagsAfter:rec.flagsBefore})+(rec.room===1&&v.box&&t>=1.6&&t<4.4?'<div class="recorded-sign">退館時は、バックヤード奥の<br>通用口を使用すること。</div>':'');
  }
  function openArchive(rec=null){
    if(!state.flags.monitor||busy)return;
    rec=rec||state.history.filter(h=>h.room===5&&h.success).at(-1);if(!rec)return;
    recordToken++;firstRecording=!state.flags.truth;recordActive=rec;recordElapsed=0;
    openModal('archive',`<div class="modal-head"><h2 id="modalTitle">${rec.room===1?'ARCHIVE 01':'直前の記録'}</h2>${button('監視室へ戻る','close','','quiet')}</div><div class="film-pair"><section class="film-pane"><div class="pane-head"><h3>あなたの視界</h3><time id="povClock"></time></div><div id="povFilm" class="record-stage"></div></section><section class="film-pane"><div class="pane-head"><h3>監視カメラ <small>CAM ${String(rec.room).padStart(2,'0')}</small></h3><time id="cameraTime"></time></div><div id="film" class="record-stage"></div></section></div><div class="present-hand"><span>手元</span><svg viewBox="0 0 180 110" role="img" aria-label="袖、腕時計、赤い紐のある手首">${handArt()}</svg></div><div class="record-bar">${button('もう一度見る','replay')}${button('次の時点','filmNext','','',true)}</div>`);
    playFilm(rec);
  }
  function paintFilm(rec,t){recordElapsed=t;$('povFilm').innerHTML=playerFrame(rec,t);$('film').innerHTML=filmFrame(rec,t);const clock=cameraClock(rec,t);$('povClock').textContent=clock;$('cameraTime').textContent=clock;}
  function playFilm(rec){
    const token=++recordToken;recordActive=rec;filmFinished=false;stillIndex=0;
    const next=$('modal').querySelector('[data-action="filmNext"]');if(next)next.disabled=!prefs.still;
    if(prefs.still){paintFilm(rec,STILL_TIMES[0]);return;}
    paintFilm(rec,0);const began=performance.now();
    function frame(now){if(token!==recordToken||modalKind!=='archive')return;const t=Math.min(FILM_LENGTH,(now-began)/1000);paintFilm(rec,t);if(t<FILM_LENGTH)requestAnimationFrame(frame);else finishFilm(token);}
    requestAnimationFrame(frame);
  }
  function nextFilm(){if(!prefs.still||filmFinished||stillIndex>=STILL_TIMES.length-1)return;stillIndex++;paintFilm(recordActive,STILL_TIMES[stillIndex]);if(stillIndex===STILL_TIMES.length-1){const next=$('modal').querySelector('[data-action="filmNext"]');if(next)next.disabled=true;finishFilm(recordToken);}}
  function beginQuiet(duration=QUIET_LENGTH*1000){
    const epoch=++quietEpoch;quietActive=true;busy=true;state.quietUntil=Date.now()+duration;notice='';render();
    setTimeout(()=>{if(epoch!==quietEpoch)return;Meiten.markArchiveReady(state);quietActive=false;busy=false;notice='';render();},duration);
  }
  function finishFilm(token){
    if(token!==recordToken||modalKind!=='archive')return;filmFinished=true;
    if(recordActive.room===5&&recordActive.success)Meiten.markTruth(state);
    save();closeModal();
    if(state.flags.truth)beginQuiet();else render();
  }
  function dispatch(action){
    if(busy)return;
    if(modalKind&&!['close','replay','filmNext','resetAsk','reset','settings'].includes(action)&&!action.startsWith('record:'))return;
    if(action==='leaveBox'){notice='';Meiten.leaveBox(state);render();return;}
    if(action==='transport'){runTransport();return;}
    if(action==='recordStart'){stepBack('recording');return;}
    if(action==='work'){notice='';Meiten.enterWork(state);render();return;}
    if(action.startsWith('manual:')){const k=action.split(':')[1],v=state.rooms[state.room][k];if(Meiten.change(state,k,!v)){notice='';render();$('hands')?.classList.add('show');}return;}
    if(action.startsWith('go:')){const res=Meiten.navigate(state,Number(action.split(':')[1]));if(res.needsReturn){stepBack();return;}notice=res.ok?'':res.reason;render();return;}
    if(action==='return'){stepBack();return;}
    if(action==='paper'){if(state.rooms[1].box)showPaper();return;}
    if(action==='readerNote'){showReader();return;}
    if(action==='terminal'){openModal('read',modalHead('閲覧端末')+'<p>閲覧：停止中<br>記録：継続中<br>昇降台：使用許可停止中</p><p>遮光板で、連続記録の起動テストを行う。</p>');return;}
    if(action==='archive'){openArchive();return;}
    if(action==='archive01'){if(state.flags.archiveReady)openArchive(archive01());return;}
    if(action==='close'){const sign=modalKind==='paper';closeModal();if(sign)stepBack();return;}
    if(action==='settings'){showSettings();return;}
    if(action==='resetAsk'){askReset();return;}
    if(action==='reset'){reset();return;}
    if(action==='filmNext'){nextFilm();return;}
    if(action==='replay'){playFilm(recordActive);return;}
    if(action.startsWith('record:')){if(!state.flags.archiveReady)return;const rec=state.history.find(h=>h.id===Number(action.split(':')[1]));if(rec&&[1,5].includes(rec.room))openArchive(rec);}
  }
  document.addEventListener('click',e=>{const el=e.target.closest?.('[data-action]');if(el&&!el.disabled)dispatch(el.dataset.action);});
  document.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('[role="button"][data-action]')){e.preventDefault();dispatch(e.target.dataset.action);}
    if(e.key==='Escape'&&!$('modalLayer').hidden)dispatch('close');
    if(e.key==='Tab'&&!$('modalLayer').hidden){const els=[...$('modal').querySelectorAll('button:not(:disabled),input')].filter(x=>!x.closest('[hidden]'));const first=els[0],last=els.at(-1);if(!els.includes(document.activeElement)){e.preventDefault();(e.shiftKey?last:first)?.focus();}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
  });
  document.addEventListener('change',e=>{if(e.target.id==='still'){prefs.still=e.target.checked;try{localStorage.setItem(PREF,JSON.stringify(prefs));}catch{}}});
  $('menu').addEventListener('click',()=>{if(!busy&&!modalKind)showSettings();});
  $('begin').addEventListener('click',()=>{if(saved?.started){askReset();return;}state=Meiten.start(Meiten.fresh());discardedSave=false;$('versionNotice').hidden=true;notice='';render();});
  $('resume').addEventListener('click',()=>{state=saved;notice='';render();if(state.activity)runTransport(true);else if(state.quietUntil>0)beginQuiet(Math.min(QUIET_LENGTH*1000,Math.max(0,state.quietUntil-Date.now())));});
  $('endArchive').addEventListener('click',()=>{if(!busy)openArchive();});$('endBoxArchive').addEventListener('click',()=>{if(!busy&&state.flags.archiveReady)openArchive(archive01());});$('restartEnd').addEventListener('click',askReset);
  render();
})();
</script></body></html>
